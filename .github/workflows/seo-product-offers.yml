name: Auditoría Schema SEO

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths:
      - "scripts/generate-seo-pages.js"
      - "scripts/seo-check.js"
      - "sitemap.xml"
      - "productos/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar datos estructurados y páginas SEO
        run: npm run seo:check
