name: Site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate SEO product and category pages
        run: npm run seo:build
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Validate catalogue, pages and release rules
        run: python3 scripts/validate_site.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Node.js functional and SEO audits
        run: npm test
      - name: Commit generated SEO pages on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos categorias sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated SEO changes to commit"
          else
            git commit -m "chore: regenerate SEO product pages"
            git push
          fi
