name: Site validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check js/app.js
      - name: Validate catalogue, pages and release rules
        run: python3 scripts/validate_site.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Run Node.js functional and SEO audits
        run: npm test
